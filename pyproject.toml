[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project]
name = "winnow"
version = "0.1.0"
description = "Winnow — data analysis workflows powered by LangGraph and Deep Agents"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langgraph>=0.4",
    "deepagents>=0.3.0",
    "langchain-openai>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pandas>=2.0",
    "openpyxl",
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "tabulate",
    "python-dotenv",
    "rich"
]
